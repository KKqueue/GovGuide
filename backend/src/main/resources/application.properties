spring.application.name=government-guide-companion-api
app.version=foundation
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8765,http://127.0.0.1:8765,http://localhost:3000,http://127.0.0.1:3000}
app.content.root=${GOVGUIDE_CONTENT_ROOT:../content/services}
app.auth.users=${APP_AUTH_USERS:}
server.error.include-message=never
server.error.include-stacktrace=never
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
