services:
  - type: web
    name: govguide-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://govguide.vercel.app,https://govguide.in
      - key: GOVGUIDE_CONTENT_ROOT
        value: /app/content/services
