services:
  backend:
    build: .
    ports:
      - "8081:8081"
    environment:
      - APP_CONTENT_ROOT=/app/content/services
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - full

  backend-inmemory:
    build: .
    ports:
      - "8081:8081"
    environment:
      - APP_CONTENT_ROOT=/app/content/services
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
    profiles:
      - dev

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: govguide
      MYSQL_DATABASE: govguide
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    profiles:
      - full
