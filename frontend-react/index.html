<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Free comprehensive guide to Indian government services — Aadhaar, PAN, passport, driving license, GST, property registration, and 120+ more. Requirements, fees, processing times, and official sources." />
  <meta name="theme-color" content="#1a3a6e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1918" media="(prefers-color-scheme: dark)" />
  <meta property="og:title" content="Government Guide Companion" />
  <meta property="og:description" content="Know exactly what you need before you apply. 137+ Indian government services with verified requirements, fees, and official sources." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_IN" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Government Guide Companion" />
  <meta name="twitter:description" content="Free guide to 137+ Indian government services — requirements, fees, processing times, and official sources." />
  <link rel="canonical" href="https://govguide.in/" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet" /></noscript>
  <title>Government Guide Companion</title>
  <!-- Update data-domain to match your deployed domain (e.g. govguide.vercel.app or govguide.in) -->
  <script defer data-domain="govguide.vercel.app" src="https://plausible.io/js/script.js"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Government Guide Companion",
    "description": "Free comprehensive guide to 137+ Indian government services with verified requirements, fees, processing times, and official sources.",
    "applicationCategory": "GovernmentService",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
    "inLanguage": ["en-IN", "hi"],
    "availableLanguage": ["en", "hi"]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="cold-start-loader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAFAF8;transition:opacity .4s ease">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;background:#1a3a6e;color:#fff;font-weight:700;font-size:14px;font-family:Lato,sans-serif">GG</span>
      <span style="font-family:'EB Garamond',Georgia,serif;font-size:20px;color:#1C1917;font-weight:600">Government Guide</span>
    </div>
    <div style="width:180px;height:3px;background:#E8E8E4;border-radius:2px;overflow:hidden">
      <div id="cold-bar" style="width:0%;height:100%;background:#1a3a6e;border-radius:2px;transition:width .3s ease"></div>
    </div>
    <p style="margin-top:14px;font-family:Lato,sans-serif;font-size:13px;color:#78716C">Loading services...</p>
    <style>@media(prefers-color-scheme:dark){#cold-start-loader{background:#1A1918!important}#cold-start-loader span:last-of-type,#cold-start-loader p{color:#A8A29E!important}#cold-start-loader div>div{background:#282624!important}}</style>
    <script>!function(){var b=document.getElementById("cold-bar"),s=0;var t=setInterval(function(){s+=Math.random()*12;if(s>90)s=90;b.style.width=s+"%"},400)}()</script>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
